<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SFW Meme Card Flip Carousel</title>
  <!-- Coursera Connect SDK -->
  <script src="https://www.coursera.org/widget/coursera-widget-connect-v0.js"></script>
  <style>
    :root {
      --primary: #1a73e8;
      --bg: #f6f8fa;
      --card-bg: #ffffff;
      --text-main: #1f2328;
      --text-muted: #57606a;
      --border: #e1e4e8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 20px 12px;
      display: flex;
      justify-content: center;
    }

    .plugin-wrapper {
      width: 100%;
      max-width: 1060px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 0 18px;
    }

    .top-bar h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .top-bar .sub-hint {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .progress-badge {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--primary);
      background: #e8f0fe;
      padding: 4px 12px;
      border-radius: 20px;
      white-space: nowrap;
    }

    /* Carousel Shell with Overlapping Circular Buttons */
    .carousel-shell {
      position: relative;
      padding: 4px 18px;
    }

    .carousel-viewport {
      overflow: hidden;
      width: 100%;
      padding: 8px 2px 14px 2px;
    }

    .carousel-track {
      display: flex;
      gap: 16px;
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    /* 4 cards visible at once on desktop */
    .flip-card {
      flex: 0 0 calc((100% - 48px) / 4);
      height: 295px;
      perspective: 1000px;
      cursor: pointer;
      user-select: none;
    }

    @media (max-width: 860px) {
      .flip-card {
        flex: 0 0 calc((100% - 16px) / 2);
      }
    }

    @media (max-width: 520px) {
      .flip-card {
        flex: 0 0 100%;
      }
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }

    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front,
    .flip-card-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 12px;
      background: var(--card-bg);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Front Card: Image on top, Blue Uppercase Title below */
    .card-image-box {
      width: 100%;
      height: 225px;
      background: #eef1f5;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-label-box {
      flex: 1;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
    }

    .meme-label {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .flip-hint-icon {
      font-size: 0.78rem;
      color: #8c959f;
      flex-shrink: 0;
      margin-left: 6px;
    }

    /* Back Card: Description Revealed on Click */
    .flip-card-back {
      transform: rotateY(180deg);
      padding: 18px 16px;
      justify-content: space-between;
      background: #ffffff;
      border-color: #c2d7fa;
    }

    .back-header {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 8px;
      border-bottom: 1px solid #eef1f5;
      padding-bottom: 6px;
    }

    .back-desc {
      font-size: 0.88rem;
      line-height: 1.45;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .back-usage {
      font-size: 0.8rem;
      line-height: 1.4;
      color: var(--text-muted);
      background: #f6f8fa;
      padding: 8px 10px;
      border-left: 3px solid var(--primary);
      border-radius: 4px;
    }

    .back-footer {
      font-size: 0.75rem;
      color: #8c959f;
      text-align: right;
      margin-top: 8px;
    }

    /* Floating Circular Prev/Next Buttons */
    .arrow-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid #e1e4e8;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.14);
      color: #24292f;
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
    }

    .arrow-btn:hover:not(:disabled) {
      transform: translateY(-50%) scale(1.06);
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.18);
    }

    .arrow-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .arrow-prev {
      left: 0;
    }

    .arrow-next {
      right: 0;
    }
  </style>
</head>
<body>
  <div class="plugin-wrapper" id="app">
    <div class="top-bar">
      <div>
        <h2>7 Popular Memes</h2>
        <span class="sub-hint">Click any card to flip and read its meaning; click again to flip back.</span>
      </div>
      <span class="progress-badge" id="progressText">Viewed: 0 / 7</span>
    </div>

    <div class="carousel-shell">
      <button class="arrow-btn arrow-prev" id="prevBtn" aria-label="Previous cards">&#8249;</button>
      <div class="carousel-viewport" id="viewport">
        <div class="carousel-track" id="carouselTrack"></div>
      </div>
      <button class="arrow-btn arrow-next" id="nextBtn" aria-label="Next cards">&#8250;</button>
    </div>
  </div>

  <script>
    const memeItems = [
      {
        title: "Grumpy Cat",
        imageUrl: "https://upload.wikimedia.org/wikipedia/commons/1/1c/Grumpy_Cat_meme_example.jpg",
        description: "Tardar Sauce, a cat famous for her permanently unimpressed expression caused by feline dwarfism and an underbite.",
        usage: "Used to humorously react to Monday mornings, extra meetings, or overly cheerful announcements."
      },
      {
        title: "Trollface",
        imageUrl: "https://upload.wikimedia.org/wikipedia/en/7/73/Trollface.png",
        description: "A classic black-and-white MS Paint rage comic character wearing a wide, mischievous grin.",
        usage: "Represents lighthearted pranks, clever loopholes, or playful teasing in online discussions."
      },
      {
        title: "Kilroy Was Here",
        imageUrl: "https://upload.wikimedia.org/wikipedia/commons/9/99/Kilroy_Was_Here_-_Washington_DC_WWII_Memorial.jpg",
        description: "One of the earliest viral memes—a doodle of a bald head with a long nose peeking over a wall, popularized during WWII.",
        usage: "Shows that viral visual memes existed decades before the internet as a playful calling card."
      },
      {
        title: "Keyboard Cat",
        imageUrl: "https://upload.wikimedia.org/wikipedia/en/8/87/Keyboard_cat.jpg",
        description: "A 1984 video still of a cat named Fatso wearing a blue shirt rhythmically 'playing' an electronic keyboard.",
        usage: "Cut into the end of blooper clips to playfully 'play someone off stage' after a minor mistake."
      },
      {
        title: "Joseph Ducreux",
        imageUrl: "https://upload.wikimedia.org/wikipedia/commons/c/cf/Joseph_Ducreux_-_Self-portrait_of_the_artist_as_a_mocker.jpg",
        description: "A 1793 self-portrait by French painter Joseph Ducreux pointing enthusiastically at the viewer.",
        usage: "Paired with overly formal, 18th-century aristocratic translations of modern pop lyrics."
      },
      {
        title: "Stonks (Meme Man)",
        imageUrl: "https://upload.wikimedia.org/wikipedia/en/9/96/Meme_Man_on_transparent_background.webp",
        description: "A surreal 3D-rendered mannequin head placed in front of a rising stock chart with intentional misspellings.",
        usage: "Satirizes questionable financial or everyday decisions that feel like a genius move in the moment."
      },
      {
        title: "Doge (Kabosu)",
        imageUrl: "https://upload.wikimedia.org/wikipedia/en/5/5f/Original_Doge_meme.jpg",
        description: "A 2010 photograph of a Shiba Inu named Kabosu giving a sideways glance with raised eyebrows.",
        usage: "Paired with colorful Comic Sans monologue to express playful wonder ('much wow, very learn')."
      }
    ];

    let startIndex = 0;
    const viewedSet = new Set();

    const track = document.getElementById("carouselTrack");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const progressText = document.getElementById("progressText");

    function getVisibleCount() {
      if (window.innerWidth <= 520) return 1;
      if (window.innerWidth <= 860) return 2;
      return 4;
    }

    function renderCards() {
      track.innerHTML = "";

      memeItems.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "flip-card";
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.setAttribute("aria-label", `${item.title} card. Click to flip.`);

        card.innerHTML = `
          <div class="flip-card-inner">
            <div class="flip-card-front">
              <div class="card-image-box">
                <img src="${item.imageUrl}" alt="${item.title}" />
              </div>
              <div class="card-label-box">
                <span class="meme-label">${item.title}</span>
                <span class="flip-hint-icon" title="Click to flip">&#8635;</span>
              </div>
            </div>
            <div class="flip-card-back">
              <div>
                <div class="back-header">${item.title}</div>
                <p class="back-desc">${item.description}</p>
                <div class="back-usage"><strong>Context:</strong> ${item.usage}</div>
              </div>
              <div class="back-footer">Click to flip back &#8634;</div>
            </div>
          </div>
        `;

        const toggleFlip = () => {
          card.classList.toggle("flipped");
          if (!viewedSet.has(index)) {
            viewedSet.add(index);
            updateProgress();
          }
        };

        card.addEventListener("click", toggleFlip);
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggleFlip();
          }
        });

        track.appendChild(card);
      });

      updateCarouselPosition();
    }

    function updateCarouselPosition() {
      const visibleCount = getVisibleCount();
      const maxStart = Math.max(0, memeItems.length - visibleCount);
      startIndex = Math.max(0, Math.min(startIndex, maxStart));

      const firstCard = track.querySelector(".flip-card");
      if (firstCard) {
        const stepWidth = firstCard.getBoundingClientRect().width + 16; // card width + 16px gap
        track.style.transform = `translateX(-${startIndex * stepWidth}px)`;
      }

      prevBtn.disabled = startIndex === 0;
      nextBtn.disabled = startIndex >= maxStart;
      notifyCourseraResize();
    }

    function updateProgress() {
      progressText.textContent = `Viewed: ${viewedSet.size} / ${memeItems.length}`;
      if (viewedSet.size === memeItems.length && window.courseraApi) {
        try {
          window.courseraApi.callMethod({
            type: "SET_ANSWER",
            data: { completed: true, score: 1 }
          });
        } catch (err) {
          // Safe fallback outside Coursera
        }
      }
    }

    function notifyCourseraResize() {
      if (window.courseraApi) {
        try {
          const height = document.getElementById("app").offsetHeight + 44;
          window.courseraApi.callMethod({
            type: "SET_HEIGHT",
            data: { height: height }
          });
        } catch (err) {
          // Safe fallback outside Coursera
        }
      }
    }

    prevBtn.addEventListener("click", () => {
      startIndex -= 1;
      updateCarouselPosition();
    });

    nextBtn.addEventListener("click", () => {
      startIndex += 1;
      updateCarouselPosition();
    });

    window.addEventListener("resize", updateCarouselPosition);

    window.addEventListener("load", () => {
      renderCards();

      if (window.courseraApi) {
        try {
          window.courseraApi.callMethod({
            type: "GET_SESSION_CONFIGURATION",
            onSuccess: () => notifyCourseraResize(),
            onError: () => notifyCourseraResize()
          });
        } catch (e) {
          // Standalone preview mode
        }
      }
    });
  </script>
</body>
</html>
